name: Deploy to server

on:
  push:
    branches: [ develop ]

# 배포는 한 번에 하나씩만 실행한다. 연달아 머지하면 뒤 배포는 앞 배포가 끝날 때까지 기다린다.
# (동시에 돌면 서버의 ~/app.jar.new를 두 배포가 함께 다뤄서 mv가 실패하거나 다른 버전이 올라간다)
# 기다리는 배포가 여러 개면 가장 최신 것만 남는데, 최신 develop에 앞선 변경이 모두 들어 있어서 문제없다.
concurrency:
  group: deploy-develop
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Java 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 빌드
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: 서버 접속 준비
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: jar 서버로 보내기
        run: |
          JAR=$(ls build/libs/*.jar | grep -v plain)
          scp -i ~/.ssh/deploy_key "$JAR" ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/app.jar.new

      - name: 서버에서 재시작
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "mv ~/app.jar.new ~/app.jar && sudo systemctl restart yongpale"